<audio id="audio-player" preload="none"></audio>

<div class="player-track-info">
  <div class="track-title">Track Title</div>
  <div class="track-artist">Artist</div>
</div>

<div class="player-progress">
  <span class="time-current">0:00</span>
  <input
    type="range"
    tabindex="0"
    class="progress-bar"
    aria-label="Playback position"
    min="0"
    max="100"
    value="0"
    step="0.1"
  />
  <span class="time-duration">0:00</span>
</div>

<div class="player-controls">
  <button class="control-btn prev-btn" aria-label="Previous track" tabindex="0">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
    </svg>
  </button>
  <button class="control-btn play-pause-btn" aria-label="Play" tabindex="0">
    <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor">
      <path d="M8 5v14l11-7z" />
    </svg>
    <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none">
      <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z" />
    </svg>
  </button>
  <button class="control-btn next-btn" aria-label="Next track" tabindex="0">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M7 6v12l8.5-6z" />
      <path d="M17 6h2v12h-2z" />
    </svg>
  </button>
</div>

<div class="playlist">
  <div class="playlist-header">Up Next</div>
  <div class="playlist-items"></div>
</div>

<p class="player-error" role="status" hidden></p>
