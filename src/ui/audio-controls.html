<div id="audio-container">
  <button id="audio-toggle" class="ui-button" aria-label="Toggle music" tabindex="0">
    <svg id="audio-icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M11 5L6 9H2v6h4l5 4V5z" />
      <line x1="23" y1="9" x2="17" y2="15" />
      <line x1="17" y1="9" x2="23" y2="15" />
    </svg>
    <svg
      id="audio-icon-on"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      style="display: none"
    >
      <path d="M11 5L6 9H2v6h4l5 4V5z" />
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
    </svg>
  </button>
  <button type="button" id="now-playing" aria-label="Open music player" tabindex="0" disabled>
    <span class="now-playing-title">now playing</span>
    <span class="now-playing-artist">kate</span>
  </button>
</div>
